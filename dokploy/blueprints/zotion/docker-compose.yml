services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DATABASE_NAME: zotion_auth
      CONVEX_INSTANCE_NAME: zotion
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-auth-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zotion"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    expose:
      - 9000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY_ID}' '${S3_SECRET_ACCESS_KEY}' &&
      mc mb --ignore-existing local/zotion &&
      echo 'bucket ready'
      "

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INSTANCE_NAME: zotion
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET}
      CONVEX_CLOUD_ORIGIN: https://${convex_domain}
      CONVEX_SITE_ORIGIN: https://${convex_domain}
      POSTGRES_URL: postgresql://zotion:${POSTGRES_PASSWORD}@postgres:5432
      DO_NOT_REQUIRE_SSL: "true"
      DISABLE_BEACON: "true"
    volumes:
      - convex_data:/convex/data
    expose:
      - 3210
      - 3211
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Convex fonksiyonlarını backend'e iter. Admin key'i kendisi üretir —
  # `generate_key` INSTANCE_NAME + INSTANCE_SECRET'tan geçerli bir anahtar
  # üretiyor, bu yüzden şablonda elle adım yok.
  convex-deploy:
    image: ghcr.io/yakupemreyerli/zotion-convex-cli:latest
    depends_on:
      convex-backend:
        condition: service_healthy
    restart: "no"
    environment:
      INSTANCE_NAME: zotion
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET}
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_AUTH_ISSUER: https://${main_domain}

  zotion:
    image: ghcr.io/yakupemreyerli/zotion:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_URL: https://${main_domain}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_DATABASE_URL: postgresql://zotion:${POSTGRES_PASSWORD}@postgres:5432/zotion_auth
      AUTH_AUTO_MIGRATE: "true"
      NEXT_PUBLIC_CONVEX_URL: https://${convex_domain}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: zotion
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_SIZE: "52428800"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - 3000

volumes:
  postgres_data:
  convex_data:
  minio_data:
