# Self-hosted Zotion stack.
#
# Everything runs on your own machine: Next.js, Convex, Postgres and MinIO.
# All state lives in named volumes.
#
# Two hostnames need to reach this stack from the browser:
#   APP_URL           -> web            (port 3000)
#   NEXT_PUBLIC_CONVEX_URL -> convex-backend  (port 3210)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zotion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Convex owns a database named after CONVEX_INSTANCE_NAME, so keep the
      # bootstrap database out of the way.
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AUTH_DATABASE_NAME: ${AUTH_DATABASE_NAME:-zotion_auth}
      CONVEX_INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-zotion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-auth-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zotion}"]
      interval: 5s
      timeout: 5s
      retries: 20

  convex-backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-zotion}
      INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:?CONVEX_INSTANCE_SECRET is required}
      CONVEX_CLOUD_ORIGIN: ${NEXT_PUBLIC_CONVEX_URL:?NEXT_PUBLIC_CONVEX_URL is required}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_URL:-${NEXT_PUBLIC_CONVEX_URL}}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-zotion}:${POSTGRES_PASSWORD}@postgres:5432
      DO_NOT_REQUIRE_SSL: "true"
      DISABLE_BEACON: "true"
      REDACT_LOGS_TO_CLIENT: "false"
      RUST_LOG: ${CONVEX_LOG_LEVEL:-info}
    # The backend fetches the Better Auth JWKS from APP_URL. If your VPS cannot
    # resolve its own public domain, map it to the reverse proxy explicitly:
    # extra_hosts:
    #   - "zotion.example.com:172.17.0.1"
    volumes:
      - convex_data:/convex/data
    expose:
      - "3210"
      - "3211"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Pushes convex/*.ts to the backend on every stack start (idempotent).
  convex-deploy:
    build:
      context: .
      target: convex-cli
    depends_on:
      convex-backend:
        condition: service_healthy
    restart: "no"
    environment:
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      CONVEX_AUTH_ISSUER: ${APP_URL:?APP_URL is required}

  # Optional: the Convex admin dashboard. Point a hostname at port 6791.
  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_BACKEND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      convex-backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${NEXT_PUBLIC_CONVEX_URL}
    expose:
      - "6791"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Creates the bucket once; the app keeps every object private.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY_ID}' '${S3_SECRET_ACCESS_KEY}' &&
      mc mb --ignore-existing local/${S3_BUCKET:-zotion} &&
      echo 'bucket ready'
      "

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-zotion}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DATABASE_NAME:-zotion_auth}
      AUTH_AUTO_MIGRATE: ${AUTH_AUTO_MIGRATE:-true}
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-zotion}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-52428800}
      # The app sits behind Dokploy's reverse proxy.
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"

volumes:
  postgres_data:
  convex_data:
  minio_data:
